<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad Jokes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <style>
        body {
            background: url('https://as2.ftcdn.net/v2/jpg/04/32/61/29/1000_F_432612969_VCr4jhOMv0X8REX6Hlw8STV6idxnnRN8.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.80);
            z-index: -1; 
        }
        .joke-container {
            margin-top: 20px;
            text-align: center;
        }
        .joke-list {
            margin-top: 20px;
        }
        .joke-item {
            border: 2px solid black;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #ffffff; 
            transition: background-color 0.3s, box-shadow 0.3s; 
        }
        .joke-item:hover {
            background-color: #f0f8ff; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
        .copy-btn {
            background-color: #dc3545; 
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background-color: #c82333; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        header {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body onload="myFunc()">

    <div class="overlay"></div>

    <header class="bg-warning text-white text-center py-3">
        <div class="header-container">
            <span class="small-text">DAD JOKES</span>
            <h1><span style="font-size: smaller; color: black;">DAD JOKES</span> DAD JOKES <span style="font-size: smaller; color: black;">DAD JOKES</span></h1>
            <span class="small-text">DAD JOKES</span>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="https://connerphillipcowans.github.io/Project_Index">Dad Jokes</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/RandomDadJoke">Random Dad Joke</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/SpecificDadJoke">Specific Dad Joke</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/SearchDadJokes">Search for Dad Jokes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/SubmitAJoke">Submit Your Joke</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4 joke-container">
        <div class="joke-list">
            <h3>All Dad Jokes</h3>
            <ul id="jokeList" class="list"></ul>
        </div>
        <button id="loadMore" class="btn btn-primary mt-3" onclick="myFunc()">Load More Jokes</button>
    </div>

    <script>
        const url = "https://icanhazdadjoke.com/search";
        const options = {
            method: 'GET',
            headers: {
                'Accept': 'application/json'
            }
        };
        let currentPage = 1;
        let allJokes = [];
        let seenJokes = new Set();

        async function myFunc() {
            const response = await fetch(url + '?page=' + currentPage, options);
            const result = await response.text();
            const myObj = JSON.parse(result);

            if (myObj.results.length === 0) {
                alert("Dad's have ran out of jokes... but we shall unite and win again");
                return;
            }

            allJokes = allJokes.concat(myObj.results);
            allJokes.sort((a, b) => parseInt(a.id, 10) - parseInt(b.id, 10));

            let sortedJokes = [];
            allJokes.forEach((joke) => {
                if (!seenJokes.has(joke.id)) {
                    seenJokes.add(joke.id);
                    sortedJokes.push(joke);
                }
            });

            displayJokes(sortedJokes);
            currentPage++;
        }

        function displayJokes(jokesArray) {
            let jokesHTML = '';
            jokesArray.forEach((currentJoke, index) => {
                jokesHTML += '<li class="joke-item"><p>' + ((currentPage - 1) * 20 + index + 1) + '. ' + currentJoke.joke + '</p><button class="copy-btn" onclick="copyToClipboard(\'' + currentJoke.joke + '\')">Copy</button></li>';
            });
            document.getElementById('jokeList').innerHTML += jokesHTML;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Joke copied to clipboard!');
            }).catch(error => {
                console.error('Failed to copy joke:', error);
            });
        }

        window.onload = myFunc;
    </script>

    <hr>
    <footer class="text-center">
        <p>July 22, 2024 &bull; Conner Phillip Cowans &bull; Final Project</p>
    </footer>

</body>
</html>
