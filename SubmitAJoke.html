<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Joke</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script>
        function showAlert() {
            alert("Thank you for your submission. Dad's are finally uniting!");
        }

        function displaySubmission(event) {
            event.preventDefault();

            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var joke = document.getElementById('joke').value;

            var displayContent = "<h2>Submission Details:</h2>" +
                                 "<p><strong>Name:</strong> " + name + "</p>" +
                                 "<p><strong>Email Address:</strong> " + email + "</p>" +
                                 "<p><strong>Joke:</strong> " + joke + "</p>";

            document.getElementById('submissionDisplay').innerHTML = displayContent;

            showAlert(); 
        }
    </script>
    <style>
        #submissionDisplay {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        header {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>

   
    <header class="bg-warning text-white text-center py-3">
        <div class="header-container">
            <span class="small-text">DAD JOKES</span>
            <h1><span style="font-size: smaller; color: black;">DAD JOKES</span> DAD JOKES <span style="font-size: smaller; color: black;">DAD JOKES</span></h1>
            <span class="small-text">DAD JOKES</span>
        </div>
    </header>

   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="https://connerphillipcowans.github.io/Project_Index">Dad Jokes</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/RandomDadJoke">Random Dad Joke</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/SpecificDadJoke">Specific Dad Joke</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/SearchDadJokes">Search for Dad Jokes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://connerphillipcowans.github.io/SubmitAJoke">Submit Your Joke</a>
                </li>
            </ul>
        </div>
    </nav>

   
    <div class="container mt-4">
        <form onsubmit="displaySubmission(event);">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="joke" class="form-label">What is the joke?</label>
                <textarea class="form-control" id="joke" rows="3" required></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        
        <div id="submissionDisplay"></div>
    </div>

    <hr>
    <footer class="text-center">
        <p>July 22, 2024 &bull; Conner Phillip Cowans</p>
    </footer>

</body>
</html>
